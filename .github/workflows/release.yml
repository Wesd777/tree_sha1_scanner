name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers workflow only when you push a version tag (e.g., v1.0.0)

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Targets
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tree_sha1_scanner-windows-x64.exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact_name: tree_sha1_scanner-windows-x86.exe

          # Linux Targets
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tree_sha1_scanner-linux-x64
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            artifact_name: tree_sha1_scanner-linux-x86

          # macOS Targets (64-bit Intel and 64-bit Apple Silicon)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tree_sha1_scanner-mac-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tree_sha1_scanner-mac-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install 32-bit Linux Dependencies
      if: matrix.target == 'i686-unknown-linux-gnu'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib

    - name: Run Build
      run: cargo build --release --target ${{ matrix.target }}

    - name: Rename Binary Asset
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mv target/${{ matrix.target }}/release/tree_sha1_scanner.exe ./${{ matrix.artifact_name }}
        else
          mv target/${{ matrix.target }}/release/tree_sha1_scanner ./${{ matrix.artifact_name }}
        fi

    - name: Upload Binary Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ./${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download All Compiled Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Generate SHA-256 Checksums
      run: |
        cd artifacts
        # Find all files recursively and calculate their sha256 checksums
        find . -type f -exec sha256sum {} + | sed 's| \./| |' > ../checksums.txt
        cat ../checksums.txt

    - name: Publish Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/**/*
          ./checksums.txt

