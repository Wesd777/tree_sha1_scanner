[package]
name = "tree_sha1_scanner"
version = "0.2.0"
edition = "2021"

[dependencies]
walkdir = "2.5"
sha1 = "0.11"
clap = { version = "4.0", features = ["derive"] }
rayon = "1.10"
is-terminal = "0.4"
indicatif = "0.18"

[profile.release]	
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
